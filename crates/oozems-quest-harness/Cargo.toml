[package]
name              = "oozems-quest-harness"
version.workspace = true
edition           = "2024"
license.workspace = true

[dependencies]
anyhow      = "1.0.104"
base64      = "0.22.1"
clap        = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
getrandom   = "0.4.3"
oozems-wz   = { path = "../oozems-wz", version = "0.1.0" }
reqwest     = { version = "0.13.4", default-features = false, features = [
  "blocking",
  "json",
  "rustls"
] }
serde       = { version = "1.0.229", features = ["derive"] }
serde_json  = "1.0.151"
sha2        = "0.11.0"
toml        = "1.1.4"
url         = "2.5.8"
webbrowser  = "1.2.4"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
