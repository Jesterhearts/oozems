syntax = "proto3";

package oozems.v1;

// All API payloads use this schema. Binary image and audio assets keep their
// native formats so browsers can cache and decode them without another copy.

message Vec2 {
  float x = 1;
  float y = 2;
}

message PlayerState {
  string id = 1;
  string name = 2;
  uint32 level = 3;
  uint32 map_id = 4;
  Vec2 position = 5;
  CharacterAppearance appearance = 6;
  CharacterStats stats = 7;
  InventoryState inventory = 8;
  repeated KeyBinding key_bindings = 9;
  uint32 skill_points = 10;
  repeated LearnedSkill learned_skills = 11;
  uint64 mesos = 12;
  repeated PlayerQuest quests = 13;
  uint64 revision = 14;
  repeated QuestRecord quest_records = 15;
  repeated MonsterBookCard monster_book_cards = 16;
  uint64 cash_points = 17;
}

message MonsterBookCard {
  uint32 card_item_id = 1;
  uint32 count = 2;
}

message PlayerQuest {
  uint32 quest_id = 1;
  QuestStatus status = 2;
  repeated QuestMobProgress mob_progress = 3;
  uint64 accepted_at_unix_ms = 4;
  uint64 completed_at_unix_ms = 5;
  // One-based current question step. A passed start question awaiting a decision
  // uses one past the final step. Zero means no interaction is pending.
  uint32 dialogue_step = 6;
  // A completion quiz has passed and its selectable reward is pending.
  bool completion_quiz_passed = 7;
}

message QuestMobProgress {
  uint32 mob_id = 1;
  uint32 count = 2;
}

message QuestRecord {
  uint32 quest_id = 1;
  repeated QuestRecordEntry entries = 2;
}

message QuestRecordEntry {
  uint32 index = 1;
  string value = 2;
}

enum QuestStatus {
  QUEST_STATUS_UNSPECIFIED = 0;
  QUEST_STATUS_STARTED = 1;
  QUEST_STATUS_COMPLETED = 2;
}

message KeyBinding {
  string code = 1;
  KeyAction action = 2;
  uint32 skill_id = 3;
}

message LearnedSkill {
  uint32 skill_id = 1;
  uint32 level = 2;
  uint32 master_level = 3;
}

enum KeyAction {
  KEY_ACTION_UNSPECIFIED = 0;
  KEY_ACTION_JUMP = 1;
  KEY_ACTION_PICK_UP = 2;
  KEY_ACTION_OPEN_CHARACTER = 3;
  KEY_ACTION_OPEN_EQUIPMENT = 4;
  KEY_ACTION_OPEN_INVENTORY = 5;
  KEY_ACTION_OPEN_KEY_CONFIG = 6;
  KEY_ACTION_OPEN_SKILLS = 7;
  KEY_ACTION_BASIC_ATTACK = 8;
}

message InventoryState {
  repeated EquippedItem equipment = 1;
  uint32 capacity = 2;
  repeated InventoryItemStack stacks = 3;
}

message InventoryItemStack {
  uint32 item_id = 1;
  uint32 quantity = 2;
  // Zero means that the stack is permanent.
  uint64 expires_at_unix_ms = 3;
}

message EquippedItem {
  EquipmentSlot slot = 1;
  uint32 item_id = 2;
  // Zero means that the equipped item is permanent.
  uint64 expires_at_unix_ms = 3;
}

enum EquipmentSlot {
  EQUIPMENT_SLOT_UNSPECIFIED = 0;
  EQUIPMENT_SLOT_TOP = 1;
  EQUIPMENT_SLOT_BOTTOM = 2;
  EQUIPMENT_SLOT_SHOES = 3;
  EQUIPMENT_SLOT_WEAPON = 4;
}

message CharacterStats {
  uint32 job_id = 1;
  uint32 hp = 2;
  uint32 max_hp = 3;
  uint32 mp = 4;
  uint32 max_mp = 5;
  uint64 experience = 6;
  int32 fame = 7;
  uint32 ability_points = 8;
  uint32 strength = 9;
  uint32 dexterity = 10;
  uint32 intelligence = 11;
  uint32 luck = 12;
  uint64 experience_required = 13;
}

enum CharacterGender {
  CHARACTER_GENDER_UNSPECIFIED = 0;
  CHARACTER_GENDER_MALE = 1;
  CHARACTER_GENDER_FEMALE = 2;
}

message CharacterAppearance {
  CharacterGender gender = 1;
  uint32 skin_id = 2;
  uint32 face_id = 3;
  uint32 hair_id = 4;
}

message CharacterStyleOption {
  uint32 id = 1;
  string label = 2;
  CharacterGender gender = 3;
}

message CharacterCreationOptions {
  repeated CharacterStyleOption skins = 1;
  repeated CharacterStyleOption faces = 2;
  repeated CharacterStyleOption hairs = 3;
  repeated CharacterEquipmentOption equipment = 4;
}

message CharacterEquipmentOption {
  uint32 item_id = 1;
  string label = 2;
  EquipmentSlot slot = 3;
}

message BootstrapRequest {
  string player_id = 1;
}

message BootstrapResponse {
  PlayerState player = 1;
  CharacterCreationOptions creation_options = 2;
  ActiveBuffState active_buffs = 3;
}

message GetMovementRulesRequest {}

message GetMovementRulesResponse {
  MovementRules rules = 1;
}

message MovementRules {
  float walk_speed = 1;
  float climb_speed = 2;
  float gravity = 3;
  float jump_speed = 4;
  uint32 speed_cap = 5;
  uint32 jump_cap = 6;
  uint64 snapshot_interval_ms = 7;
  uint64 maximum_snapshot_gap_ms = 8;
  float position_tolerance = 9;
  float ground_tolerance = 10;
  float ladder_reach = 11;
  float portal_horizontal_reach = 12;
  float portal_vertical_reach = 13;
  float platform_edge_tolerance = 14;
  float ladder_end_reach = 15;
}

enum MovementMode {
  MOVEMENT_MODE_UNSPECIFIED = 0;
  MOVEMENT_MODE_GROUNDED = 1;
  MOVEMENT_MODE_AIRBORNE = 2;
  MOVEMENT_MODE_CLIMBING = 3;
}

message MovementSnapshot {
  uint64 sequence = 1;
  uint32 map_id = 2;
  Vec2 position = 3;
  MovementMode mode = 4;
  MovementContact support_contact = 5;
  bool drop_through = 6;
}

message MovementContact {
  Vec2 position = 1;
  MovementMode mode = 2;
}

message SubmitMovementRequest {
  string player_id = 1;
  MovementSnapshot snapshot = 2;
}

message EnterPortalRequest {
  string player_id = 1;
  MovementSnapshot source = 2;
  uint32 target_map_id = 3;
  string target_portal_name = 4;
}

message MovementUpdateResponse {
  MovementSnapshot authoritative = 1;
  bool accepted = 2;
  string rejection_reason = 3;
  repeated Mob mobs = 4;
  PlayerState player = 5;
  repeated MobProjectile mob_projectiles = 6;
  repeated CombatEvent combat_events = 7;
  uint64 simulation_sequence = 8;
  ActiveBuffState active_buffs = 9;
  repeated DroppedItem dropped_items = 10;
  repeated Reactor reactors = 11;
}

message CreateCharacterRequest {
  string player_id = 1;
  string name = 2;
  CharacterAppearance appearance = 3;
  repeated StartingEquipmentSelection equipment = 4;
}

message StartingEquipmentSelection {
  EquipmentSlot slot = 1;
  uint32 item_id = 2;
}

message CreateCharacterResponse {
  PlayerState player = 1;
}

message GetCharacterSpritesRequest {
  CharacterAppearance appearance = 1;
  repeated EquippedItem equipment = 2;
  bool use_starter_equipment = 3;
}

message GetCharacterSpritesResponse {
  CharacterSpriteSet sprites = 1;
}

message GetGuiRequest {
  string player_id = 1;
  repeated uint32 observed_item_ids = 2;
}

message GetGuiResponse {
  GameGui gui = 1;
}

message GetSkillBookRequest {
  string player_id = 1;
}

message GetSkillBookResponse {
  SkillBook skill_book = 1;
  ActiveBuffState active_buffs = 2;
}

message AllocateSkillPointRequest {
  string player_id = 1;
  uint32 skill_id = 2;
}

message AllocateSkillPointResponse {
  PlayerState player = 1;
  SkillBook skill_book = 2;
  ActiveBuffState active_buffs = 3;
}

message AllocateAbilityPointRequest {
  string player_id = 1;
  AbilityStat stat = 2;
}

message AllocateAbilityPointResponse {
  PlayerState player = 1;
}

enum AbilityStat {
  ABILITY_STAT_UNSPECIFIED = 0;
  ABILITY_STAT_STRENGTH = 1;
  ABILITY_STAT_DEXTERITY = 2;
  ABILITY_STAT_INTELLIGENCE = 3;
  ABILITY_STAT_LUCK = 4;
}

message UseSkillRequest {
  string player_id = 1;
  uint32 skill_id = 2;
  string target_mob_id = 3;
  bool facing_left = 4;
}

message UseSkillResponse {
  PlayerState player = 1;
  SkillUseResult result = 2;
  SkillEffect effect = 3;
  repeated Mob mobs = 4;
  repeated MobProjectile mob_projectiles = 5;
  repeated CombatEvent combat_events = 6;
  uint64 simulation_sequence = 7;
  ActiveBuffState active_buffs = 8;
  repeated DroppedItem dropped_items = 9;
  repeated Reactor reactors = 10;
}

message BasicAttackRequest {
  string player_id = 1;
  bool facing_left = 2;
}

message BasicAttackResponse {
  PlayerState player = 1;
  repeated Mob mobs = 2;
  repeated MobProjectile mob_projectiles = 3;
  repeated CombatEvent combat_events = 4;
  uint64 simulation_sequence = 5;
  repeated DroppedItem dropped_items = 6;
  ActiveBuffState active_buffs = 7;
  repeated Reactor reactors = 8;
}

message ActiveBuffState {
  repeated ActiveBuff buffs = 1;
  uint64 revision = 2;
  uint64 observed_at_unix_ms = 3;
  sint32 weapon_attack = 4;
  sint32 magic_attack = 5;
  sint32 weapon_defense = 6;
  sint32 magic_defense = 7;
  sint32 accuracy = 8;
  sint32 avoidability = 9;
  sint32 speed = 10;
  sint32 jump = 11;
  uint32 morph_id = 12;
  bool attacks_disabled = 13;
}

message ActiveBuff {
  oneof source {
    uint32 skill_id = 1;
    uint32 item_id = 2;
  }
  uint32 skill_level = 3;
  sint32 speed_bonus = 4;
  sint32 jump_bonus = 5;
  uint64 activated_at_unix_ms = 6;
  uint64 expires_at_unix_ms = 7;
  sint32 weapon_attack = 8;
  sint32 magic_attack = 9;
  sint32 weapon_defense = 10;
  sint32 magic_defense = 11;
  sint32 accuracy = 12;
  sint32 avoidability = 13;
  uint32 morph_id = 14;
}

message RecoverPlayerRequest {
  string player_id = 1;
}

message RecoverPlayerResponse {
  PlayerState player = 1;
  uint32 hp_restored = 2;
  uint32 mp_restored = 3;
  uint64 retry_after_ms = 4;
  ActiveBuffState active_buffs = 5;
}

message RespawnPlayerRequest {
  string player_id = 1;
}

message RespawnPlayerResponse {
  PlayerState player = 1;
  Map map = 2;
  MovementSnapshot authoritative = 3;
  ActiveBuffState active_buffs = 4;
}

message SkillUseResult {
  uint32 skill_id = 1;
  uint32 skill_level = 2;
  uint32 hp_spent = 3;
  uint32 mp_spent = 4;
  uint32 hp_restored = 5;
  bool has_damage = 6;
  uint32 minimum_damage = 7;
  uint32 maximum_damage = 8;
  sint32 speed_bonus = 9;
  sint32 jump_bonus = 10;
  uint64 duration_ms = 11;
  uint32 mp_restored = 12;
  bool fixed_damage = 13;
  sint32 weapon_attack_bonus = 14;
  sint32 magic_attack_bonus = 15;
  sint32 weapon_defense_bonus = 16;
  sint32 magic_defense_bonus = 17;
  sint32 accuracy_bonus = 18;
  sint32 avoidability_bonus = 19;
}

message SkillEffect {
  repeated SkillAnimation animations = 1;
  repeated AssetDescriptor assets = 2;
  AssetDescriptor sound = 3;
}

message SkillAnimation {
  SkillAnimationPlacement placement = 1;
  repeated SkillAnimationFrame frames = 2;
  uint32 start_delay_ms = 3;
}

enum SkillAnimationPlacement {
  SKILL_ANIMATION_PLACEMENT_UNSPECIFIED = 0;
  SKILL_ANIMATION_PLACEMENT_CASTER = 1;
  SKILL_ANIMATION_PLACEMENT_PROJECTILE = 2;
  SKILL_ANIMATION_PLACEMENT_TARGET = 3;
}

message SkillAnimationFrame {
  string asset_id = 1;
  float width = 2;
  float height = 3;
  float origin_x = 4;
  float origin_y = 5;
  uint32 delay_ms = 6;
}

message AnimationFrame {
  string asset_id = 1;
  float width = 2;
  float height = 3;
  float origin_x = 4;
  float origin_y = 5;
  uint32 delay_ms = 6;
}

message GameGui {
  GuiLayout status_bar = 1;
  repeated AssetDescriptor assets = 2;
  GuiWindow stat_window = 3;
  GuiWindow equipment_window = 4;
  GuiWindow inventory_window = 5;
  repeated ItemDefinition items = 6;
  GuiWindow key_config_window = 7;
  repeated KeyActionDefinition key_actions = 8;
  repeated KeySlot key_slots = 9;
  GuiWindow skill_window = 10;
  GuiWindow npc_dialog_window = 11;
  GuiWindow shop_window = 12;
  GuiWindow cash_shop_window = 13;
  repeated NpcFrame quest_available_frames = 14;
  repeated NpcFrame quest_ready_frames = 15;
  GuiWindow death_notice_window = 16;
  repeated AnimationFrame death_tomb_frames = 17;
}

message SkillBook {
  uint32 job_id = 1;
  string name = 2;
  uint32 available_points = 3;
  repeated PlayerSkill skills = 4;
  repeated AssetDescriptor assets = 5;
}

message PlayerSkill {
  SkillDefinition definition = 1;
  uint32 level = 2;
  uint32 master_level = 3;
}

message SkillDefinition {
  uint32 skill_id = 1;
  uint32 job_id = 2;
  string name = 3;
  string description = 4;
  uint32 max_level = 5;
  string icon_asset_id = 6;
  float icon_width = 7;
  float icon_height = 8;
  repeated SkillLevelDefinition levels = 9;
  SkillStats common_stats = 10;
  repeated SkillProperty common_properties = 11;
  repeated SkillProperty metadata = 12;
  repeated SkillRequirement requirements = 13;
}

message SkillLevelDefinition {
  uint32 level = 1;
  string description = 2;
  SkillStats stats = 3;
  repeated SkillProperty properties = 4;
}

message SkillRequirement {
  uint32 skill_id = 1;
  uint32 level = 2;
}

message SkillProperty {
  string name = 1;
  SkillValue value = 2;
}

message SkillValue {
  oneof value {
    sint64 integer = 1;
    double decimal = 2;
    string text = 3;
    Vec2 vector = 4;
  }
}

message SkillStats {
  SkillValue hp_cost = 1;
  SkillValue mp_cost = 2;
  SkillValue hp = 3;
  SkillValue mp = 4;
  SkillValue weapon_attack = 5;
  SkillValue magic_attack = 6;
  SkillValue accuracy = 7;
  SkillValue avoidability = 8;
  SkillValue weapon_defense = 9;
  SkillValue magic_defense = 10;
  SkillValue speed = 11;
  SkillValue jump = 12;
  SkillValue strength = 13;
  SkillValue damage = 14;
  SkillValue fixed_damage = 15;
  SkillValue critical_damage = 16;
  SkillValue mastery = 17;
  SkillValue attack_count = 18;
  SkillValue mob_count = 19;
  SkillValue duration = 20;
  SkillValue cooldown = 21;
  SkillValue range = 22;
  SkillValue success_probability = 23;
  SkillValue x = 24;
  SkillValue y = 25;
  SkillValue z = 26;
}

message KeyActionDefinition {
  KeyAction action = 1;
  string label = 2;
  GuiSprite icon = 3;
}

message KeySlot {
  string code = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
}

message ItemDefinition {
  uint32 item_id = 1;
  string name = 2;
  EquipmentSlot slot = 3;
  string icon_asset_id = 4;
  float icon_width = 5;
  float icon_height = 6;
  uint64 sale_price = 7;
  ItemCategory category = 8;
  uint32 stack_max = 9;
  string description = 10;
  bool appearance_supported = 11;
  uint32 weapon_attack = 12;
  uint32 weapon_defense = 13;
  uint32 magic_defense = 14;
  repeated SetupItemFrame setup_frames = 15;
  bool usable = 16;
}

message SetupItemFrame {
  string asset_id = 1;
  float width = 2;
  float height = 3;
  float origin_x = 4;
  float origin_y = 5;
  uint32 delay_ms = 6;
}

enum ItemCategory {
  ITEM_CATEGORY_UNSPECIFIED = 0;
  ITEM_CATEGORY_EQUIPMENT = 1;
  ITEM_CATEGORY_CONSUME = 2;
  ITEM_CATEGORY_ETC = 3;
  ITEM_CATEGORY_INSTALL = 4;
  ITEM_CATEGORY_CASH = 5;
  ITEM_CATEGORY_PET = 6;
}

message GuiLayout {
  float width = 1;
  float height = 2;
  GuiSprite background = 3;
  repeated GuiSprite sprites = 4;
  repeated GuiSpriteTemplate sprite_templates = 5;
  repeated GuiRegion regions = 6;
}

message GuiSprite {
  string name = 1;
  string asset_id = 2;
  float x = 3;
  float y = 4;
  float width = 5;
  float height = 6;
  bool anchor_right = 7;
  float origin_x = 8;
  float origin_y = 9;
}

message GuiSpriteTemplate {
  string name = 1;
  string asset_id = 2;
  float width = 3;
  float height = 4;
  float origin_x = 5;
  float origin_y = 6;
  float offset_x = 7;
  float offset_y = 8;
}

message GuiRegion {
  string name = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
}

message GuiWindow {
  float x = 1;
  float y = 2;
  GuiLayout layout = 3;
}

// Authored GUI files use stable WZ paths. The server resolves these paths to
// versioned runtime assets when it loads UI.wz.
message GuiWindowDefinition {
  string name = 1;
  float x = 2;
  float y = 3;
  GuiSpriteSource background = 4;
  repeated GuiSpriteSource sprites = 5;
  repeated GuiSpriteTemplateSource sprite_templates = 6;
  repeated GuiRegion regions = 7;
  float width = 8;
  float height = 9;
}

message GuiSpriteSource {
  string name = 1;
  string wz_path = 2;
  float x = 3;
  float y = 4;
  bool anchor_right = 5;
  bool pin_right = 6;
  float right = 7;
  bool pin_bottom = 8;
  float bottom = 9;
}

message GuiSpriteTemplateSource {
  string name = 1;
  string wz_path = 2;
  float offset_x = 3;
  float offset_y = 4;
}

message CharacterSpriteSet {
  repeated CharacterFrame idle_frames = 1;
  repeated AssetDescriptor assets = 2;
  repeated CharacterFrame walk_frames = 3;
  repeated CharacterFrame jump_frames = 4;
  repeated CharacterFrame ladder_frames = 5;
  repeated CharacterFrame rope_frames = 6;
  repeated CharacterFrame attack_frames = 7;
  repeated CharacterFrame death_frames = 8;
  repeated CharacterFrame sit_frames = 9;
}

message GetMorphRequest {
  uint32 morph_id = 1;
}

message GetMorphResponse {
  MorphDefinition morph = 1;
}

message MorphDefinition {
  uint32 morph_id = 1;
  repeated MorphAnimation animations = 2;
  repeated AssetDescriptor assets = 3;
  bool no_cancel_damage = 4;
}

message MorphAnimation {
  string name = 1;
  repeated MorphFrame frames = 2;
}

message MorphFrame {
  string asset_id = 1;
  float width = 2;
  float height = 3;
  float origin_x = 4;
  float origin_y = 5;
  uint32 delay_ms = 6;
}

message CharacterFrame {
  repeated CharacterLayer layers = 1;
  uint32 delay_ms = 2;
}

message CharacterLayer {
  string asset_id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
}

message GetMapRequest {
  uint32 map_id = 1;
  string player_id = 2;
}

message GetMapResponse {
  Map map = 1;
}

message SavePlayerRequest {
  PlayerState player = 1;
}

message SavePlayerResponse {
  PlayerState player = 1;
  ActiveBuffState active_buffs = 2;
}

message EquipItemRequest {
  string player_id = 1;
  uint32 inventory_index = 2;
  uint32 expected_item_id = 3;
  uint64 expected_expires_at_unix_ms = 4;
}

message UnequipItemRequest {
  string player_id = 1;
  EquipmentSlot slot = 2;
}

message DropItemRequest {
  string player_id = 1;
  uint32 inventory_index = 2;
  uint32 expected_item_id = 3;
  uint64 expected_expires_at_unix_ms = 4;
}

message UseItemRequest {
  string player_id = 1;
  uint32 inventory_index = 2;
  uint32 expected_item_id = 3;
  uint64 expected_expires_at_unix_ms = 4;
}

message PickUpItemRequest {
  string player_id = 1;
}

message ItemActionResponse {
  PlayerState player = 1;
  DroppedItem dropped_item = 2;
  string picked_up_drop_id = 3;
  ActiveBuffState active_buffs = 4;
  // Nonzero when an Install item placed the local character in its setup state.
  uint32 used_setup_item_id = 5;
}

message GetCashShopRequest {}

message GetCashShopResponse {
  repeated CashShopOffer offers = 1;
  string currency_name = 2;
}

message CashShopOffer {
  uint32 offer_id = 1;
  uint32 item_id = 2;
  uint64 price = 3;
  // Zero means that the purchased item is permanent.
  uint64 duration_ms = 4;
}

message PurchaseCashShopItemRequest {
  string player_id = 1;
  uint32 offer_id = 2;
}

message PurchaseCashShopItemResponse {
  PlayerState player = 1;
  uint32 offer_id = 2;
  uint32 item_id = 3;
  // Zero means that the purchased item is permanent.
  uint64 expires_at_unix_ms = 4;
  ActiveBuffState active_buffs = 5;
}

message NpcInteractionRequest {
  string player_id = 1;
  uint32 map_id = 2;
  uint32 npc_spawn_id = 3;
  oneof action {
    OpenNpcAction open = 4;
    SelectNpcChoiceAction select_choice = 5;
    BuyShopItemAction buy = 6;
    SellShopItemAction sell = 7;
    TakeTaxiAction take_taxi = 8;
  }
}

message OpenNpcAction {}

message SelectNpcChoiceAction {
  uint32 quest_id = 1;
  uint32 choice_id = 2;
}

message BuyShopItemAction {
  uint32 item_id = 1;
}

message SellShopItemAction {
  uint32 inventory_index = 1;
  uint32 expected_item_id = 2;
  uint64 expected_expires_at_unix_ms = 3;
}

message TakeTaxiAction {
  uint32 target_map_id = 1;
}

message NpcInteractionResponse {
  PlayerState player = 1;
  NpcInteraction interaction = 2;
  MovementSnapshot authoritative = 3;
  Map map = 4;
  NpcAnimationEvent npc_animation = 5;
  ActiveBuffState active_buffs = 6;
  repeated NpcQuestIndicatorUpdate quest_indicators = 7;
}

message NpcQuestIndicatorUpdate {
  uint32 npc_spawn_id = 1;
  NpcQuestIndicator indicator = 2;
}

message NpcAnimationEvent {
  uint32 map_id = 1;
  uint32 npc_spawn_id = 2;
  uint32 npc_id = 3;
  string action_name = 4;
  uint64 player_revision = 5;
}

message NpcInteraction {
  uint32 map_id = 1;
  uint32 npc_spawn_id = 2;
  uint32 npc_id = 3;
  string npc_name = 4;
  oneof view {
    NpcDialogView dialog = 5;
    NpcShopView shop = 6;
    NpcTaxiView taxi = 7;
  }
}

message NpcDialogView {
  uint32 quest_id = 1;
  string title = 2;
  repeated string pages = 3;
  repeated NpcDialogChoice choices = 4;
}

message NpcDialogChoice {
  uint32 choice_id = 1;
  string label = 2;
  NpcDialogChoiceKind kind = 3;
}

enum NpcDialogChoiceKind {
  NPC_DIALOG_CHOICE_KIND_UNSPECIFIED = 0;
  NPC_DIALOG_CHOICE_KIND_ACCEPT_QUEST = 1;
  NPC_DIALOG_CHOICE_KIND_DECLINE_QUEST = 2;
  NPC_DIALOG_CHOICE_KIND_ANSWER = 3;
  NPC_DIALOG_CHOICE_KIND_COMPLETE_QUEST = 4;
  NPC_DIALOG_CHOICE_KIND_SELECT_QUEST_REWARD = 5;
  NPC_DIALOG_CHOICE_KIND_RESTORE_QUEST_ITEMS = 6;
}

message NpcShopView {
  repeated NpcShopOffer offers = 1;
  NpcShopCurrency currency = 2;
  string currency_name = 3;
}

enum NpcShopCurrency {
  NPC_SHOP_CURRENCY_UNSPECIFIED = 0;
  NPC_SHOP_CURRENCY_MESOS = 1;
  NPC_SHOP_CURRENCY_CASH_POINTS = 2;
}

message NpcShopOffer {
  uint32 item_id = 1;
  uint64 buy_price = 2;
}

message NpcTaxiView {
  repeated NpcTaxiDestination destinations = 1;
}

message NpcTaxiDestination {
  uint32 map_id = 1;
  string label = 2;
  uint64 fare = 3;
}

message Map {
  uint32 id = 1;
  string name = 2;
  uint32 width = 3;
  uint32 height = 4;
  repeated Platform platforms = 5;
  repeated Decoration decorations = 6;
  repeated AssetDescriptor assets = 7;
  repeated Ladder ladders = 8;
  repeated Portal portals = 9;
  repeated DroppedItem dropped_items = 10;
  repeated MobSpawnPoint mob_spawn_points = 11;
  repeated MobDefinition mob_definitions = 12;
  repeated Mob mobs = 13;
  MapMovementBounds movement_bounds = 14;
  repeated MobProjectile mob_projectiles = 15;
  uint64 simulation_sequence = 16;
  repeated Npc npcs = 17;
  optional uint32 return_map_id = 18;
  bool town = 19;
  repeated ReactorSpawnPoint reactor_spawn_points = 20;
  repeated ReactorDefinition reactor_definitions = 21;
  repeated Reactor reactors = 22;
  MapAudio audio = 23;
}

message MapAudio {
  AssetDescriptor bgm = 1;
  AssetDescriptor jump = 2;
  AssetDescriptor portal = 3;
  AssetDescriptor pick_up_item = 4;
  AssetDescriptor drop_item = 5;
  AssetDescriptor use_item = 6;
  AssetDescriptor tombstone = 7;
  AssetDescriptor level_up = 8;
  AssetDescriptor quest_clear = 9;
}

message MapMovementBounds {
  // Inclusive limits for the horizontal player anchor after collision width.
  float left = 1;
  float right = 2;
}

message Npc {
  uint32 spawn_id = 1;
  uint32 npc_id = 2;
  Vec2 position = 3;
  bool flip_x = 4;
  int32 layer = 5;
  string name = 6;
  string function = 7;
  repeated string ambient_lines = 8;
  repeated NpcAnimation animations = 9;
  NpcQuestIndicator quest_indicator = 10;
}

enum NpcQuestIndicator {
  NPC_QUEST_INDICATOR_UNSPECIFIED = 0;
  NPC_QUEST_INDICATOR_AVAILABLE = 1;
  NPC_QUEST_INDICATOR_READY = 2;
}

message NpcAnimation {
  string name = 1;
  repeated NpcFrame frames = 2;
}

message NpcFrame {
  string asset_id = 1;
  float width = 2;
  float height = 3;
  float origin_x = 4;
  float origin_y = 5;
  uint32 delay_ms = 6;
}

message MobSpawnPoint {
  uint32 spawn_id = 1;
  uint32 mob_id = 2;
  Vec2 position = 3;
  float roam_left = 4;
  float roam_right = 5;
  bool flip_x = 6;
  int32 layer = 7;
  uint32 respawn_seconds = 8;
  uint32 foothold_id = 9;
}

message MobDefinition {
  uint32 id = 1;
  uint32 level = 2;
  uint64 max_hp = 3;
  uint64 max_mp = 4;
  uint64 experience = 5;
  int32 physical_attack = 6;
  int32 physical_defense = 7;
  int32 magic_attack = 8;
  int32 magic_defense = 9;
  int32 accuracy = 10;
  int32 avoidability = 11;
  int32 speed = 12;
  bool body_attack = 13;
  bool boss = 14;
  bool undead = 15;
  repeated MobAnimation animations = 16;
  bool can_jump = 17;
  AssetDescriptor damage_sound = 18;
  AssetDescriptor death_sound = 19;
}

message MobAnimation {
  string name = 1;
  repeated MobFrame frames = 2;
}

message MobFrame {
  string asset_id = 1;
  float width = 2;
  float height = 3;
  float origin_x = 4;
  float origin_y = 5;
  uint32 delay_ms = 6;
}

message Mob {
  string id = 1;
  uint32 definition_id = 2;
  Vec2 position = 3;
  bool flip_x = 4;
  int32 layer = 5;
  uint64 current_hp = 6;
  uint32 spawn_id = 7;
  MobMovementMode movement_mode = 8;
}

message MobProjectile {
  string id = 1;
  string source_mob_id = 2;
  string target_player_id = 3;
  Vec2 position = 4;
  int32 layer = 5;
}

message ReactorSpawnPoint {
  uint32 spawn_id = 1;
  uint32 reactor_id = 2;
  Vec2 position = 3;
  bool flip_x = 4;
  int32 layer = 5;
  uint32 respawn_seconds = 6;
}

message ReactorDefinition {
  uint32 id = 1;
  repeated ReactorStateDefinition states = 2;
}

message ReactorStateDefinition {
  uint32 state = 1;
  repeated ReactorFrame frames = 2;
  repeated ReactorFrame hit_frames = 3;
  optional uint32 next_state = 4;
}

message ReactorFrame {
  string asset_id = 1;
  float width = 2;
  float height = 3;
  float origin_x = 4;
  float origin_y = 5;
  uint32 delay_ms = 6;
}

message Reactor {
  string id = 1;
  uint32 definition_id = 2;
  uint32 spawn_id = 3;
  uint32 state = 4;
  bool active = 5;
}

message CombatEvent {
  string id = 1;
  CombatEventKind kind = 2;
  string source_id = 3;
  string target_id = 4;
  uint64 damage = 5;
  Vec2 position = 6;
}

enum CombatEventKind {
  COMBAT_EVENT_KIND_UNSPECIFIED = 0;
  COMBAT_EVENT_KIND_PLAYER_HIT_MOB = 1;
  COMBAT_EVENT_KIND_MOB_TOUCHED_PLAYER = 2;
  COMBAT_EVENT_KIND_MOB_PROJECTILE_HIT_PLAYER = 3;
  COMBAT_EVENT_KIND_MOB_DIED = 4;
  COMBAT_EVENT_KIND_MOB_RESPAWNED = 5;
  COMBAT_EVENT_KIND_PLAYER_MISSED_MOB = 6;
  COMBAT_EVENT_KIND_MOB_MISSED_PLAYER = 7;
  COMBAT_EVENT_KIND_PLAYER_HIT_REACTOR = 8;
  COMBAT_EVENT_KIND_REACTOR_DESTROYED = 9;
  COMBAT_EVENT_KIND_REACTOR_RESPAWNED = 10;
}

enum MobMovementMode {
  MOB_MOVEMENT_MODE_UNSPECIFIED = 0;
  MOB_MOVEMENT_MODE_IDLE = 1;
  MOB_MOVEMENT_MODE_WALKING = 2;
  MOB_MOVEMENT_MODE_JUMPING = 3;
  MOB_MOVEMENT_MODE_ATTACKING = 4;
}

message DroppedItem {
  string id = 1;
  uint32 item_id = 2;
  Vec2 position = 3;
  uint64 despawn_at_unix_ms = 4;
  uint32 quantity = 5;
  // Zero means that the item itself is permanent. The drop is active only
  // while both this deadline and despawn_at_unix_ms permit it.
  uint64 expires_at_unix_ms = 6;
}

message Platform {
  float x = 1;
  float y = 2;
  float end_x = 3;
  float end_y = 4;
  int32 layer = 5;
  uint32 id = 6;
}

message Decoration {
  string asset_id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  int32 layer = 6;
  bool flip_x = 7;
  repeated DecorationFrame frames = 8;
}

message DecorationFrame {
  string asset_id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  uint32 delay_ms = 6;
}

message Ladder {
  float x = 1;
  float top = 2;
  float bottom = 3;
  bool is_ladder = 4;
  bool upper_floor = 5;
  int32 layer = 6;
}

message Portal {
  string name = 1;
  float x = 2;
  float y = 3;
  uint32 target_map_id = 4;
  string target_name = 5;
  uint32 kind = 6;
  repeated PortalFrame frames = 7;
  int32 layer = 8;
}

message PortalFrame {
  string asset_id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  uint32 delay_ms = 6;
}

message AssetDescriptor {
  string id = 1;
  string url = 2;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
}
