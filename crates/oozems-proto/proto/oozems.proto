syntax = "proto3";

package oozems.v1;

// All API payloads use this schema. Binary image and audio assets keep their
// native formats so browsers can cache and decode them without another copy.

message Vec2 {
  float x = 1;
  float y = 2;
}

message PlayerState {
  string id = 1;
  string name = 2;
  uint32 level = 3;
  uint32 map_id = 4;
  Vec2 position = 5;
}

message BootstrapRequest {
  string player_id = 1;
}

message BootstrapResponse {
  PlayerState player = 1;
}

message GetMapRequest {
  uint32 map_id = 1;
}

message GetMapResponse {
  Map map = 1;
}

message SavePlayerRequest {
  PlayerState player = 1;
}

message SavePlayerResponse {
  PlayerState player = 1;
}

message Map {
  uint32 id = 1;
  string name = 2;
  uint32 width = 3;
  uint32 height = 4;
  repeated Platform platforms = 5;
  repeated Decoration decorations = 6;
  repeated AssetDescriptor assets = 7;
  repeated Ladder ladders = 8;
  repeated Portal portals = 9;
}

message Platform {
  float x = 1;
  float y = 2;
  float width = 3;
  PlatformKind kind = 4;
  float end_x = 5;
  float end_y = 6;
  bool hidden = 7;
}

enum PlatformKind {
  PLATFORM_KIND_UNSPECIFIED = 0;
  PLATFORM_KIND_GROUND = 1;
  PLATFORM_KIND_WOOD = 2;
}

message Decoration {
  string asset_id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  int32 layer = 6;
  bool flip_x = 7;
}

message Ladder {
  float x = 1;
  float top = 2;
  float bottom = 3;
  bool is_ladder = 4;
  bool upper_floor = 5;
}

message Portal {
  string name = 1;
  float x = 2;
  float y = 3;
  uint32 target_map_id = 4;
  string target_name = 5;
  uint32 kind = 6;
  repeated PortalFrame frames = 7;
}

message PortalFrame {
  string asset_id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  uint32 delay_ms = 6;
}

message AssetDescriptor {
  string id = 1;
  string url = 2;
  string content_hash = 3;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
}
