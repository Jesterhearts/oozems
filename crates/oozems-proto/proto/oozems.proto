syntax = "proto3";

package oozems.v1;

// All API payloads use this schema. Binary image and audio assets keep their
// native formats so browsers can cache and decode them without another copy.

message Vec2 {
  float x = 1;
  float y = 2;
}

message PlayerState {
  string id = 1;
  string name = 2;
  uint32 level = 3;
  uint32 map_id = 4;
  Vec2 position = 5;
  CharacterAppearance appearance = 6;
  CharacterStats stats = 7;
  InventoryState inventory = 8;
  repeated KeyBinding key_bindings = 9;
}

message KeyBinding {
  string code = 1;
  KeyAction action = 2;
}

enum KeyAction {
  KEY_ACTION_UNSPECIFIED = 0;
  KEY_ACTION_JUMP = 1;
  KEY_ACTION_PICK_UP = 2;
  KEY_ACTION_OPEN_CHARACTER = 3;
  KEY_ACTION_OPEN_EQUIPMENT = 4;
  KEY_ACTION_OPEN_INVENTORY = 5;
  KEY_ACTION_OPEN_KEY_CONFIG = 6;
}

message InventoryState {
  repeated uint32 item_ids = 1;
  repeated EquippedItem equipment = 2;
  uint32 capacity = 3;
}

message EquippedItem {
  EquipmentSlot slot = 1;
  uint32 item_id = 2;
}

enum EquipmentSlot {
  EQUIPMENT_SLOT_UNSPECIFIED = 0;
  EQUIPMENT_SLOT_TOP = 1;
  EQUIPMENT_SLOT_BOTTOM = 2;
  EQUIPMENT_SLOT_SHOES = 3;
}

message CharacterStats {
  uint32 job_id = 1;
  uint32 hp = 2;
  uint32 max_hp = 3;
  uint32 mp = 4;
  uint32 max_mp = 5;
  uint64 experience = 6;
  int32 fame = 7;
  uint32 ability_points = 8;
  uint32 strength = 9;
  uint32 dexterity = 10;
  uint32 intelligence = 11;
  uint32 luck = 12;
  uint64 experience_required = 13;
}

enum CharacterGender {
  CHARACTER_GENDER_UNSPECIFIED = 0;
  CHARACTER_GENDER_MALE = 1;
  CHARACTER_GENDER_FEMALE = 2;
}

message CharacterAppearance {
  CharacterGender gender = 1;
  uint32 skin_id = 2;
  uint32 face_id = 3;
  uint32 hair_id = 4;
}

message CharacterStyleOption {
  uint32 id = 1;
  string label = 2;
  CharacterGender gender = 3;
}

message CharacterCreationOptions {
  repeated CharacterStyleOption skins = 1;
  repeated CharacterStyleOption faces = 2;
  repeated CharacterStyleOption hairs = 3;
}

message BootstrapRequest {
  string player_id = 1;
}

message BootstrapResponse {
  PlayerState player = 1;
  CharacterCreationOptions creation_options = 2;
}

message CreateCharacterRequest {
  string player_id = 1;
  string name = 2;
  CharacterAppearance appearance = 3;
}

message CreateCharacterResponse {
  PlayerState player = 1;
}

message GetCharacterSpritesRequest {
  CharacterAppearance appearance = 1;
  repeated EquippedItem equipment = 2;
  bool use_starter_equipment = 3;
}

message GetCharacterSpritesResponse {
  CharacterSpriteSet sprites = 1;
}

message GetGuiRequest {}

message GetGuiResponse {
  GameGui gui = 1;
}

message GameGui {
  GuiLayout status_bar = 1;
  repeated AssetDescriptor assets = 2;
  GuiWindow stat_window = 3;
  GuiWindow equipment_window = 4;
  GuiWindow inventory_window = 5;
  repeated ItemDefinition items = 6;
  GuiWindow key_config_window = 7;
  repeated KeyActionDefinition key_actions = 8;
  repeated KeySlot key_slots = 9;
}

message KeyActionDefinition {
  KeyAction action = 1;
  string label = 2;
  GuiSprite icon = 3;
}

message KeySlot {
  string code = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
}

message ItemDefinition {
  uint32 item_id = 1;
  string name = 2;
  EquipmentSlot slot = 3;
  string icon_asset_id = 4;
  float icon_width = 5;
  float icon_height = 6;
}

message GuiLayout {
  float width = 1;
  float height = 2;
  GuiSprite background = 3;
  repeated GuiSprite sprites = 4;
}

message GuiSprite {
  string name = 1;
  string asset_id = 2;
  float x = 3;
  float y = 4;
  float width = 5;
  float height = 6;
  bool anchor_right = 7;
}

message GuiWindow {
  float x = 1;
  float y = 2;
  GuiLayout layout = 3;
}

message CharacterSpriteSet {
  repeated CharacterFrame idle_frames = 1;
  repeated AssetDescriptor assets = 2;
  repeated CharacterFrame walk_frames = 3;
  repeated CharacterFrame jump_frames = 4;
  repeated CharacterFrame ladder_frames = 5;
  repeated CharacterFrame rope_frames = 6;
}

message CharacterFrame {
  repeated CharacterLayer layers = 1;
  uint32 delay_ms = 2;
}

message CharacterLayer {
  string asset_id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
}

message GetMapRequest {
  uint32 map_id = 1;
}

message GetMapResponse {
  Map map = 1;
}

message SavePlayerRequest {
  PlayerState player = 1;
}

message SavePlayerResponse {
  PlayerState player = 1;
}

message EquipItemRequest {
  string player_id = 1;
  uint32 inventory_index = 2;
}

message UnequipItemRequest {
  string player_id = 1;
  EquipmentSlot slot = 2;
}

message DropItemRequest {
  string player_id = 1;
  uint32 inventory_index = 2;
}

message PickUpItemRequest {
  string player_id = 1;
  uint32 map_id = 2;
  Vec2 position = 3;
}

message ItemActionResponse {
  PlayerState player = 1;
  DroppedItem dropped_item = 2;
  string picked_up_drop_id = 3;
}

message Map {
  uint32 id = 1;
  string name = 2;
  uint32 width = 3;
  uint32 height = 4;
  repeated Platform platforms = 5;
  repeated Decoration decorations = 6;
  repeated AssetDescriptor assets = 7;
  repeated Ladder ladders = 8;
  repeated Portal portals = 9;
  repeated DroppedItem dropped_items = 10;
}

message DroppedItem {
  string id = 1;
  uint32 item_id = 2;
  Vec2 position = 3;
  uint64 despawn_at_unix_ms = 4;
}

message Platform {
  float x = 1;
  float y = 2;
  float width = 3;
  PlatformKind kind = 4;
  float end_x = 5;
  float end_y = 6;
  bool hidden = 7;
  int32 layer = 8;
}

enum PlatformKind {
  PLATFORM_KIND_UNSPECIFIED = 0;
  PLATFORM_KIND_GROUND = 1;
  PLATFORM_KIND_WOOD = 2;
}

message Decoration {
  string asset_id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  int32 layer = 6;
  bool flip_x = 7;
  repeated DecorationFrame frames = 8;
}

message DecorationFrame {
  string asset_id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  uint32 delay_ms = 6;
}

message Ladder {
  float x = 1;
  float top = 2;
  float bottom = 3;
  bool is_ladder = 4;
  bool upper_floor = 5;
  int32 layer = 6;
}

message Portal {
  string name = 1;
  float x = 2;
  float y = 3;
  uint32 target_map_id = 4;
  string target_name = 5;
  uint32 kind = 6;
  repeated PortalFrame frames = 7;
  int32 layer = 8;
}

message PortalFrame {
  string asset_id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  uint32 delay_ms = 6;
}

message AssetDescriptor {
  string id = 1;
  string url = 2;
  string content_hash = 3;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
}
