[package]
name    = "oozems-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow             = "1.0.104"
axum               = "0.8.9"
hex                = "0.4.3"
humantime          = "2.4.0"
image              = { version = "0.25.10", default-features = false, features = [
  "png"
] }
oozems-proto       = { path = "../oozems-proto", version = "0.1.0" }
prost              = "0.14.4"
serde              = { version = "1.0.229", features = ["derive"] }
serde_json         = "1.0.151"
sha2               = "0.11.0"
shipyard           = "0.11.5"
surrealdb          = { version = "3.2.4", default-features = false, features = [
  "kv-surrealkv"
] }
thiserror          = "2.0.20"
tokio              = { version = "1.53.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal"
] }
toml               = "1.1.4"
tower              = "0.5.3"
tower-http         = { version = "0.7.0", features = [
  "compression-full",
  "fs",
  "set-header",
  "trace"
] }
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wz_reader          = { version = "0.0.24", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
