# Oozems-authored 1x policy. WZ archives provide facts, not these rates.
# Formula tables use: base + level * per_level + isqrt(exp) * per_experience_sqrt,
# capped at maximum. All chances are per million and all ranges are inclusive.

schema_version = 1
policy_name    = "Oozems v83-inspired 1x"

[item_class_ppm]
equipment           = 1100
recovery            = 16000
mobility            = 4500
scroll              = 650
cure                = 8000
ammo                = 14000
rechargeable        = 450
common_mob_material = 200000
ore_crafting        = 5000
miscellaneous       = 2500
quest               = 220000

[boss_multipliers.item]
numerator   = 2
denominator = 1

[boss_multipliers.card]
